<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Quiz</title>
    <link rel='stylesheet' href='styles/quiz.css'>
</head>

<body>
    <header>
        <h1>HTML | CSS Quiz</h1>
    </header>

    <main>
        <form action="#" method="post">

            <div class="form-item">
                <label for="q1">1. What CSS property is used to change the color of text?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="form-item">
                <label for="q2">2. what is the diference between html and css </label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <div class="form-item">
                <label for="q3">3. Which property sets an element's display behavior to a flexible
                    box layout?

                </label>
                <select id="q3" name="q3" required>
                    <option value="" disabled selected>Choose an option...</option>
                    <option value="block">block</option>
                    <option value="flex">flex</option>
                    <option value="bgcolor">grid</option>
                    <option value="nope">it's not possible</option>
                </select>
            </div>


            <div class="form-item">
                <label for="q4">4. How many heading tags (h1 through h6) exist in HTML?</label>
                <input type="number" id="q4" name="q4" min="1" max="10" required>
            </div>

            <button type="submit">Submit Quiz</button>

        </form>
    </main>


</body>

</html>
