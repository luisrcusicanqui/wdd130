<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Form</title>
    <link rel='stylesheet' href='styles/poll-form.css'>
</head>

<body>
    <header>
        <h1>WDD130|HTML form - user pol</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label>Full Name: <input type="text" name="fullname" required></label>
                </div>
                <div class="form-item" column2>
                    <label>Email: <input type="email" name="useremail" required></label>
                </div>

            </fieldset>

            <fieldset>
                <legend>Questions</legend>

                <div class="form-item column1">
                    <label for="favorite-browser">What is your favorite browser?</label>

                    <select name="quantity" id="quantity">
                        <option value="1">chrome</option>
                        <option value="2">microsoft edge</option>
                        <option value="3">Brave</option>
                        <option value="4">Other</opt>
                    </select>
                </div>
                <div class="form-item column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="form-item">
                    <label for="feedback">List the places you have lived:</label>
                    <textarea id="feedback" name="feedback" rows="4"
                      placeholder="santa cruz bolivia,logan utah "></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>

        </form>


    </main>
    <footer>

    </footer>

</body>

</html>
